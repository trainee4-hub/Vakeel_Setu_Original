<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/DY_logo.png" />
    <link rel="apple-touch-icon" href="/DY_logo.png" />
    <link rel="shortcut icon" type="image/png" href="/DY_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advocate Connect - India's Leading Legal Tech Platform</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              executive: {
                indigo: '#1a1c2e',
                charcoal: '#0d0d0f',
                gold: '#d4af37',
                emerald: '#064e3b',
              },
            },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .executive-mesh {
          background-color: #0d0d0f;
          background-image:
            linear-gradient(to bottom, rgba(26, 28, 46, 0.7), rgba(13, 13, 15, 0.85)),
            url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?q=80&w=2070&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        }
        .executive-mesh-advocate {
          background-color: #0d0d0f;
          background-image:
            linear-gradient(to bottom, rgba(26, 28, 46, 0.8), rgba(13, 13, 15, 0.9)),
            url('https://images.unsplash.com/photo-1593115057322-e94b77572f20?q=80&w=2070&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        }
        .grainy-texture {
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
          opacity: 0.05;
          pointer-events: none;
        }
        .light-leak {
          background: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.07) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.04) 0%, transparent 50%);
          pointer-events: none;
        }
        .glass-hub {
          background: rgba(26, 28, 46, 0.7);
          backdrop-filter: blur(24px);
          border: 1px solid rgba(212, 175, 55, 0.15);
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-gold-warm {
          background: rgba(35, 30, 20, 0.45);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(212, 175, 55, 0.15);
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .input-luxury {
          border: 1px solid rgba(212, 175, 55, 0.1);
          color: inherit;
          background: transparent;
          transition: all 0.3s ease;
        }
        .input-luxury:focus {
          border-color: rgba(212, 175, 55, 0.5);
          outline: none;
          box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
        }
        .step-indicator {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 2rem;
          height: 2rem;
          border-radius: 999px;
          font-size: 0.75rem;
          font-weight: 700;
          border: 1px solid rgba(255, 255, 255, 0.1);
          transition: all 0.5s ease;
        }
        .step-indicator.active {
          background: #f59e0b;
          border-color: #f59e0b;
          color: #0f172a;
          box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .step-indicator.completed {
          background: #10b981;
          border-color: #10b981;
          color: #fff;
        }
        .step-indicator.pending {
          background: rgba(255, 255, 255, 0.04);
          border-color: rgba(255, 255, 255, 0.1);
          color: #64748b;
        }
        .floating-label-input:focus-within label,
        .floating-label-input input:not(:placeholder-shown) + label {
          transform: translateY(-1.5rem) scale(0.85);
          color: #d4af37;
        }
        .glass-gold {
          background: rgba(28, 28, 35, 0.65);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(212, 175, 55, 0.12);
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-gold-hover:hover {
          background: rgba(35, 35, 45, 0.75);
          border-color: rgba(212, 175, 55, 0.3);
        }
        .text-glow-gold {
          text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .icon-gradient-gold {
          background: linear-gradient(135deg, #fef08a 0%, #d4af37 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .scale-watermark {
          opacity: 0.03;
          font-size: 40rem;
          user-select: none;
          pointer-events: none;
        }
        .pillars-bg {
          background-image: repeating-linear-gradient(
            90deg,
            transparent,
            transparent 180px,
            rgba(212, 175, 55, 0.03) 180px,
            rgba(212, 175, 55, 0.03) 181px
          );
        }
        .icon-gradient-gold {
          background: linear-gradient(135deg, #fef08a 0%, #d4af37 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
